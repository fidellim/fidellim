name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Daily at 20:17 UTC (00:17 Asia/Dubai).
    - cron: "17 20 * * *"

# Both workflows write to this repository; serialize their updates.
concurrency:
  group: profile-readme-updates
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master #PLEASE USE MASTER BRANCH
      # - uses: fidellim/waka-readme-stats@show_total_time
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          COMMIT_BY_ME: "True"
          COMMIT_MESSAGE: "💥 Update README with Wakatime and Other GitHub Stats 💥"
          SHOW_TOTAL_CODE_TIME: "False"
          SHOW_UPDATED_DATE: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_PROFILE_VIEWS: "False"
          SHOW_LOC_CHART: "False"
          SYMBOL_VERSION: 1
